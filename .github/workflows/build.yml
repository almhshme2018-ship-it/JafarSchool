name: Check MainActivity Braces

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Show lines 550 to 600
        run: |
          echo "=== MainActivity 550-600 ==="
          nl -ba extracted/app/src/main/java/com/jafar/school/MainActivity.java | sed -n '550,600p'

      - name: Check brace balance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/app/src/main/java/com/jafar/school/MainActivity.java")
          lines = p.read_text(encoding="utf-8").splitlines()

          balance = 0

          for i, line in enumerate(lines, 1):
              balance += line.count("{")
              balance -= line.count("}")

              if 540 <= i <= 600:
                  print(f"{i}: balance={balance} | {line}")

          print("FINAL BALANCE:", balance)
          PY
