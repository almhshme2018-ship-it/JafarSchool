name: Fix and Build JafarSchool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Fix MainActivity line
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("extracted/app/src/main/java/com/jafar/school/MainActivity.java")

          text = file.read_text(encoding="utf-8")

          old = 'addCard("📴 التشغيل دون إنترنت","لا يحتاج التطبيق إلى اتصال بالإنترنت للوظائف الأساسية. سيتم استخدام الاتصال فقط مستقبلاً إذا أضيفت مزامنة أو تحديثات اختيارية.");addCard("🏫 بيانات المدرسة","مدرسة جعفر بن أبي طالب الأساسية\\nالجمهورية اليمنية – إب – مذيخرة – الأشعوب");'

          new = 'addCard("📴 التشغيل دون إنترنت","لا يحتاج التطبيق إلى اتصال بالإنترنت للوظائف الأساسية.");addCard("🏫 بيانات المدرسة","مدرسة جعفر بن أبي طالب الأساسية");'

          if old not in text:
              print("النص المطلوب لم يُعثر عليه")
              raise SystemExit(1)

          text = text.replace(old, new, 1)

          file.write_text(text, encoding="utf-8")

          print("تم إصلاح النص بدون إضافة أو حذف أي أقواس.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug --console=plain

      - name: Find APK
        run: |
          echo "=== APK ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
