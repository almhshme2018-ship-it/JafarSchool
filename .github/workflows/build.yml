name: Show JafarSchool Structure

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  show:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Show Gradle Files
        run: |
          echo "START_GRADLE_FILES"
          find extracted -type f | grep -E 'gradle|settings' || true
          echo "END_GRADLE_FILES"

      - name: Show Project Files
        run: |
          echo "START_PROJECT_FILES"
          find extracted -maxdepth 5 -type f | head -100
          echo "END_PROJECT_FILES"
