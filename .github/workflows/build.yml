name: Find Android Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  find-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_PATH=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 8 -type f -print

      - name: Find settings.gradle
        run: |
          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            echo "=== Extracted folders ==="
            find extracted -maxdepth 8 -type d -print
            exit 1
          fi

          echo "================================"
          echo "Android project found successfully"
          echo "settings.gradle:"
          echo "$SETTINGS_FILE"
          echo "================================"

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory:"
          echo "$PROJECT_DIR"
