name: Build JafarSchool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
