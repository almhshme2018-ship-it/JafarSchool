name: Test JafarSchool Gradle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find settings.gradle
        run: |
          echo "=== settings.gradle files ==="
          find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Find gradlew
        run: |
          echo "=== gradlew files ==="
          find extracted -type f -name "gradlew" -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Gradle files
        run: |
          echo "=== Android project files ==="
          find extracted -maxdepth 6 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print
