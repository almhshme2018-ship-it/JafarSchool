name: Build JafarSchool APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Searching settings.gradle ==="
          find extracted -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Find project
        run: |
          set -e

          SETTINGS=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Project directory ==="
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleDebug --console=plain

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=== APK ==="
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v2.0.0-build-${{ github.run_number }}"

          gh release create "$TAG" \
            "$APK" \
            --title "مدرسة جعفر - $TAG" \
            --notes "نسخة APK قابلة للتثبيت من تطبيق مدرسة جعفر." \
            --latest
