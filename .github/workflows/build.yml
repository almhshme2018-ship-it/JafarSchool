name: Build JafarSchool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Fix MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("extracted/app/src/main/java/com/jafar/school/MainActivity.java")

          lines = file.read_text(encoding="utf-8").splitlines()

          lines[421] = '        addCard("📴 التشغيل دون إنترنت","لا يحتاج التطبيق إلى اتصال بالإنترنت للوظائف الأساسية.");'
          lines.insert(422, '        addCard("🏫 بيانات المدرسة","مدرسة جعفر بن أبي طالب الأساسية");')
          lines.insert(423, '        addCard("🌍 موقع المدرسة","الجمهورية اليمنية - إب - مذيخرة - الأشعوب");')

          file.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("MainActivity.java fixed successfully")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug --console=plain

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
