name: Build JafarSchool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          find extracted -maxdepth 4 -type f | sort | head -n 200

      - name: Locate Android project
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix MainActivity Java
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/jafar/school/MainActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          # Fix literal backslash-n before changePassword
          text = text.replace(
              "\\n    void changePassword()",
              "\n    void changePassword()"
          )

          # Remove old group grade methods if they are outside MainActivity
          start = text.find("// V1.7.0 GROUP GRADE ENTRY")

          if start != -1:
              class_db = text.find("\nclass DB", start)

              if class_db != -1:
                  block = text[start:class_db]

                  open_start = block.find("private void openGroupGradeEntry()")
                  period_start = block.find("private String gradeEntryPeriodName(int period)")

                  methods = ""

                  if open_start != -1:
                      end = block.find("\n    }", open_start)
                      if end != -1:
                          end += len("\n    }")
                          methods += "\n" + block[open_start:end]

                  if period_start != -1:
                      end = block.find("\n    }", period_start)
                      if end != -1:
                          end += len("\n    }")
                          methods += "\n" + block[period_start:end]

                  text = text[:start] + text[class_db:]

                  # Insert methods before MainActivity closing brace
                  marker = "\n}\n\nclass DB"

                  pos = text.find(marker)

                  if pos == -1:
                      print("ERROR: MainActivity closing brace not found")
                      sys.exit(1)

                  text = text[:pos] + methods + "\n" + text[pos:]

          p.write_text(text, encoding="utf-8")

          print("MainActivity Java fixed successfully.")
          PY

          echo "=== VERIFY 415-445 ==="
          nl -ba "$FILE" | sed -n '415,445p'

          echo "=== VERIFY 570-605 ==="
          nl -ba "$FILE" | sed -n '570,605p'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --console=plain

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
