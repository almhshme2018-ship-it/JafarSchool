name: Diagnose JafarSchool Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Gradle configuration
        run: |
          cd extracted
          echo "=== SETTINGS.GRADLE ==="
          cat settings.gradle
          echo "=== ROOT BUILD.GRADLE ==="
          cat build.gradle
          echo "=== APP BUILD.GRADLE ==="
          cat app/build.gradle

      - name: Test Gradle
        run: |
          cd extracted
          gradle tasks --stacktrace --info
