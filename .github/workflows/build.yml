name: Diagnose JafarSchool

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show ZIP
        run: |
          echo "=== ZIP files ==="
          ls -la *.zip

      - name: Extract ZIP
        run: |
          echo "=== Extracting ==="
          unzip -q *.zip -d extracted
          echo "Extraction completed"

      - name: Show project tree
        run: |
          echo "=== Project tree ==="
          find extracted -maxdepth 8 -type f -print

      - name: Find settings.gradle
        run: |
          echo "=== settings.gradle ==="
          find extracted -type f -name settings.gradle -print

      - name: Find gradlew
        run: |
          echo "=== gradlew ==="
          find extracted -type f -name gradlew -print

      - name: Find build.gradle
        run: |
          echo "=== build.gradle ==="
          find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -print
