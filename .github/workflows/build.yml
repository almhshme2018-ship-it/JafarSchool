name: Check MainActivity Braces

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Check MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/app/src/main/java/com/jafar/school/MainActivity.java")
          lines = p.read_text(encoding="utf-8").splitlines()

          balance = 0

          for n, line in enumerate(lines, 1):
              balance += line.count("{")
              balance -= line.count("}")

              if n >= 550:
                  print(f"{n}: balance={balance} | {line}")

          print("================================")
          print("FINAL BRACE BALANCE:", balance)
          print("TOTAL LINES:", len(lines))
          print("================================")
          PY
