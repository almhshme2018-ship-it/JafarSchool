name: Extract MainActivity

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Searching MainActivity.java ==="
          find extracted -type f -name "MainActivity.java" -print

      - name: Copy MainActivity
        run: |
          set -e

          FILE=$(find extracted -type f -name "MainActivity.java" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          echo "Found: $FILE"

          mkdir -p output
          cp "$FILE" output/MainActivity.java

          echo "=== File information ==="
          wc -l output/MainActivity.java
          ls -lh output/MainActivity.java

      - name: Upload MainActivity
        uses: actions/upload-artifact@v4
        with:
          name: MainActivity-source
          path: output/MainActivity.java
          if-no-files-found: error
