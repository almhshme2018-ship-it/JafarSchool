name: Show Java Error

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Show MainActivity lines
        run: |
          echo "================================"
          echo "MainActivity.java lines 410-435"
          echo "================================"

          nl -ba extracted/app/src/main/java/com/jafar/school/MainActivity.java | sed -n '410,435p'
