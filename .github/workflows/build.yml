name: Build JafarSchool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Move MainActivity closing brace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/app/src/main/java/com/jafar/school/MainActivity.java")
          lines = p.read_text(encoding="utf-8").splitlines()

          # Remove the closing brace that currently ends MainActivity
          if lines[569].strip() == "}":
              del lines[569]
          else:
              raise SystemExit("Expected MainActivity closing brace at line 570")

          # Add MainActivity closing brace after gradeEntryPeriodName
          if lines[-1].strip() == "}":
              lines.append("}")
          else:
              raise SystemExit("Unexpected end of MainActivity.java")

          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("MainActivity brace position fixed.")
          PY

      - name: Verify Java section
        run: |
          nl -ba extracted/app/src/main/java/com/jafar/school/MainActivity.java | sed -n '560,600p'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug --console=plain

      - name: Find APK
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
