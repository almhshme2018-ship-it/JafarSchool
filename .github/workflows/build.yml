name: Diagnose Gradle Files

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Find Gradle files
        run: |
          echo "=== ALL GRADLE FILES ==="
          find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.jar" \
            -o -name "gradle-wrapper.properties" \
            -o -name "gradlew" \
            -o -name "gradlew.bat" \
          \) -print

      - name: Show project folders
        run: |
          echo "=== PROJECT FOLDERS ==="
          find extracted -maxdepth 4 -type d -print
