name: Test JafarSchool Gradle Wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List ZIP
        run: ls -la *.zip

      - name: Extract ZIP
        run: unzip -q *.zip -d extracted

      - name: Find and test Gradle
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find extracted -maxdepth 8 -type f -print
            exit 1
          fi

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          PROJECT=$(dirname "$GRADLEW")

          echo "Project directory:"
          echo "$PROJECT"

          echo "=== Gradle wrapper files ==="
          ls -la "$PROJECT"

          chmod +x "$GRADLEW"

          echo "=== Gradle version ==="
          "$GRADLEW" --version
