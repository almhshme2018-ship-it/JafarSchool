name: Extract JafarSchool Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_PATH=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          echo "=== Extracted project ==="
          find extracted -maxdepth 8 -type f -print

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-Extracted-Project
          path: extracted/
          if-no-files-found: error
