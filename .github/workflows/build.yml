name: Build JafarSchool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted project ==="
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Locate Android project
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Fix MainActivity Java
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/jafar/school/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          # إصلاح newline مكتوبة حرفياً داخل Java
          text = text.replace(
              '\\n    void changePassword()',
              '\n    void changePassword()'
          )

          lines = text.splitlines()

          # البحث عن openGroupGradeEntry
          target = None

          for i, line in enumerate(lines):
              if "private void openGroupGradeEntry()" in line:
                  target = i
                  break

          if target is None:
              print("ERROR: openGroupGradeEntry() not found")
              sys.exit(1)

          print("openGroupGradeEntry line:", target + 1)

          # إزالة القوس الذي أغلق MainActivity قبل الدالة
          j = target - 1

          while j >= 0 and not lines[j].strip():
              j -= 1

          if j >= 0 and lines[j].strip() == "}":
              print("Removing misplaced brace at line:", j + 1)
              del lines[j]

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("MainActivity.java fixed")
          PY

      - name: Show Java section
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/jafar/school/MainActivity.java"

          echo "=== Lines 415-430 ==="
          nl -ba "$FILE" | sed -n '415,430p'

          echo "=== Lines 565-595 ==="
          nl -ba "$FILE" | sed -n '565,595p'
      - name: Show MainActivity problem area
        run: |
          echo "=== MainActivity 540-600 ==="
          nl -ba extracted/app/src/main/java/com/jafar/school/MainActivity.java | sed -n '540,600p'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Show exact Java problem
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/jafar/school/MainActivity.java"

          echo "===== LINES 560-595 ====="
          nl -ba "$FILE" | sed -n '560,595p'
      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --console=plain

      - name: Find APK
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
