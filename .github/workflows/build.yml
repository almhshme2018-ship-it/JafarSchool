name: Build JafarSchool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted project ==="
          find extracted -maxdepth 4 -type f | sort | head -n 200

      - name: Locate Android project
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix MainActivity Java
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/jafar/school/MainActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          start_marker = "// V1.7.0 GROUP GRADE ENTRY"

          start = text.find(start_marker)

          if start == -1:
              print("ERROR: GROUP GRADE ENTRY block not found")
              sys.exit(1)

          end_marker = "\n}\n"
          end = text.find(end_marker, start)

          if end == -1:
              print("ERROR: End of GROUP GRADE ENTRY block not found")
              sys.exit(1)

          end += len(end_marker)

          block = text[start:end]

          text = text[:start] + text[end:]

          class_end_marker = "\n}\n\nclass DB"

          class_end = text.find(class_end_marker)

          if class_end == -1:
              print("ERROR: MainActivity closing brace not found")
              sys.exit(1)

          insertion = "\n\n" + block.rstrip() + "\n"

          text = (
              text[:class_end]
              + insertion
              + text[class_end:]
          )

          p.write_text(text, encoding="utf-8")

          print("GROUP GRADE ENTRY methods moved inside MainActivity.")
          PY

          echo "=== VERIFY LOCATION ==="
          nl -ba "$FILE" | sed -n '410,450p'
          nl -ba "$FILE" | sed -n '555,610p'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --console=plain

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
