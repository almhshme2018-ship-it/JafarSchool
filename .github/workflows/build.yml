name: Diagnose JafarSchool Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        continue-on-error: true
        run: |
          cd extracted
          gradle assembleDebug --console=plain 2>&1 | tee build.log
          echo ${PIPESTATUS[0]} > build.exit

      - name: Show build error
        run: |
          echo "================================"
          echo "BUILD RESULT"
          echo "================================"

          if [ -f extracted/build.exit ]; then
            echo "Exit code:"
            cat extracted/build.exit
          fi

          echo "================================"
          echo "IMPORTANT ERROR"
          echo "================================"

          grep -n -B 5 -A 15 \
            -E "FAILURE:|What went wrong|Execution failed|Could not|error:" \
            extracted/build.log \
            | tail -150 || true

          echo "================================"
          echo "LAST 80 LINES"
          echo "================================"

          tail -80 extracted/build.log

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          find extracted -type f -name "*.apk" -print
