name: Build JafarSchool APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP file:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            echo "Searching extracted files:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install current Java files
        shell: bash
        run: |
          set -e

          TARGET="$PROJECT_DIR/app/src/main/java/com/jafar/school"

          mkdir -p "$TARGET"

          if [ ! -f "MainActivity.java" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          if [ ! -f "DB.java" ]; then
            echo "ERROR: DB.java not found"
            exit 1
          fi

          cp "MainActivity.java" "$TARGET/MainActivity.java"
          cp "DB.java" "$TARGET/DB.java"

          echo "Files copied successfully."

          echo "MainActivity:"
          wc -l "$TARGET/MainActivity.java"

          echo "DB:"
          wc -l "$TARGET/DB.java"

      - name: Verify Java files
        shell: bash
        run: |
          set -e

          TARGET="$PROJECT_DIR/app/src/main/java/com/jafar/school"

          if [ ! -f "$TARGET/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java missing"
            exit 1
          fi

          if [ ! -f "$TARGET/DB.java" ]; then
            echo "ERROR: DB.java missing"
            exit 1
          fi

          grep -q "package com.jafar.school;" "$TARGET/MainActivity.java"
          grep -q "package com.jafar.school;" "$TARGET/DB.java"

          echo "Java package verification successful."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Check generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated"
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
