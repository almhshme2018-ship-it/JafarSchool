name: Diagnose APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK with clear error
        continue-on-error: true
        run: |
          cd extracted
          gradle assembleDebug --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show important error
        if: failure()
        run: |
          echo "=============================="
          echo "IMPORTANT BUILD ERROR"
          echo "=============================="

          grep -n -B 5 -A 15 \
            -E "What went wrong|Execution failed|Could not|error:" \
            extracted/build.log \
            | tail -100 || true

      - name: Show APK
        if: success()
        run: |
          echo "=== APK FILES ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
