name: Test JafarSchool Gradle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List ZIP
        run: ls -la *.zip

      - name: Extract ZIP
        run: unzip -q *.zip -d extracted

      - name: Test Gradle
        run: |
          SETTINGS=$(find extracted -name settings.gradle -print | head -n 1)
          PROJECT=$(dirname "$SETTINGS")

          echo "Project directory:"
          echo "$PROJECT"

          echo "=== Gradle files ==="
          ls -la "$PROJECT"

          chmod +x "$PROJECT/gradlew"

          echo "=== Gradle version ==="
          "$PROJECT/gradlew" --version
