name: Locate JafarSchool Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  locate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List ZIP
        run: ls -la *.zip

      - name: Extract ZIP
        run: unzip -q *.zip -d extracted

      - name: Find Project
        run: |
          SETTINGS=$(find extracted -name settings.gradle -print | head -n 1)
          echo "settings.gradle:"
          echo "$SETTINGS"

          PROJECT=$(dirname "$SETTINGS")

          echo "Project directory:"
          echo "$PROJECT"

          echo "=== Project files ==="
          ls -la "$PROJECT"
