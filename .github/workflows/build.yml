name: Check JafarSchool Gradle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List ZIP
        run: ls -la *.zip

      - name: Extract ZIP
        run: unzip -q *.zip -d extracted

      - name: Find Project
        run: |
          SETTINGS=$(find extracted -name settings.gradle -print | head -n 1)
          echo "SETTINGS=$SETTINGS"

          PROJECT=$(dirname "$SETTINGS")
          echo "PROJECT=$PROJECT"

          echo "=== Project files ==="
          ls -la "$PROJECT"

      - name: Find Gradle Wrapper
        run: |
          echo "=== gradlew files ==="
          find extracted -type f -name gradlew -print

          echo "=== Gradle wrapper files ==="
          find extracted -type f \( -name gradle-wrapper.jar -o -name gradle-wrapper.properties \) -print
