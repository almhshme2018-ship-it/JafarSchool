name: Test JafarSchool Gradle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-gradle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_PATH=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Project files ==="
          ls -la

          echo "=== Gradle wrapper ==="
          ls -la gradlew

          chmod +x gradlew

          echo "=== Gradle version ==="
          ./gradlew --version
