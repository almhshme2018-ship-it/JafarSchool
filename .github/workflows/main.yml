name: JafarSchool Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app.zip
        run: |
          echo "=== ZIP contents ==="
          unzip -l app.zip
          echo "=== Extracting ==="
          unzip -q app.zip
          echo "=== Root after extraction ==="
          ls -la
          echo "=== App directory ==="
          ls -la app

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
