name: JafarSchool Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Extract app.zip
        run: |
          echo "=== ZIP contents ==="
          unzip -l app.zip

          echo "=== Extracting ==="
          unzip -q app.zip

          echo "=== Project files ==="
          find . -maxdepth 5 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

      - name: Locate Android project
        run: |
          SETTINGS_FILE=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "The ZIP structure is incomplete or settings.gradle is missing."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        run: |
          echo "=== PROJECT_DIR ==="
          echo "$PROJECT_DIR"

          echo "=== Project root ==="
          ls -la "$PROJECT_DIR"

          echo "=== settings.gradle ==="
          cat "$PROJECT_DIR/settings.gradle"

          echo "=== App directory ==="
          ls -la "$PROJECT_DIR/app"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JafarSchool-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
